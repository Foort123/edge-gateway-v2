<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Edge Gateway V2</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101827; color: #edf2fa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(40rem, calc(100% - 3rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #2a3b53; border-radius: 1rem; background: #172338; }
      .label { color: #9eb7df; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .8rem 0; font-size: clamp(2rem, 6vw, 3rem); }
      p { color: #c2cedf; line-height: 1.65; }
      code { color: #c7dcff; }
      footer { margin-top: 2rem; color: #8da0bb; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Cloudflare Pages Function</div>
      <h1>Edge Gateway V2</h1>
      <p>VLESS over WebSocket is available at <code>/ws</code>. The gateway supports TCP and DNS over HTTPS. Other UDP traffic and ICMP are not supported.</p>
      <footer>This page confirms that the static site is deployed; it does not test the tunnel.</footer>
    </main>
  </body>
</html>
